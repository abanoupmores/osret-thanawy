name: Build Android APK
# 4.1.1: يبني APK من نوع Release موقّع بمفتاح ثابت (من GitHub Secrets) حتى تُثبَّت الإصدارات فوق بعضها.
# لا يُنتج أبدًا APK debug/موقّع بمفتاح مؤقت: لو الأسرار ناقصة يفشل البناء برسالة واضحة.
# الدليل الكامل: SIGNING_AND_UPDATES.md
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'إنشاء GitHub Release برابط تحميل ثابت (يلزم مستودع عام ليعمل التحديث من داخل التطبيق)'
        type: boolean
        default: true
permissions:
  contents: write        # لإنشاء الـ Release فقط (GITHUB_TOKEN المؤقت، لا يظهر في التطبيق)
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OSRET_PACKAGE: org.osretthanawy.service
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من أسرار التوقيع
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          miss=""
          [ -z "$KS" ]  && miss="$miss ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && miss="$miss ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ]  && miss="$miss ANDROID_KEY_ALIAS"
          [ -z "$KP" ]  && miss="$miss ANDROID_KEY_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::أسرار التوقيع ناقصة:$miss — اتبع SIGNING_AND_UPDATES.md (الخطوة 2). لن يُبنى APK بمفتاح مؤقت لأنه لن يقبل التحديث."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: رقم الإصدار
        id: ver
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: |
          NAME=$(node -p "require('./package.json').version")
          CODE=$(( ${GITHUB_RUN_NUMBER} + ${OFFSET:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      - name: إعداد Firebase (من سر FIREBASE_CONFIG_JSON إن وُجد)
        env:
          FBCFG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FBCFG" ]; then echo "$FBCFG" > src/firebase-config.json; echo "تم ضبط Firebase من السر"; else echo "::warning::FIREBASE_CONFIG_JSON غير مضبوط — سيظهر التطبيق بشاشة «الإعداد ناقص»"; fi
      - run: npm install
      - run: npm run build
      - run: npx cap add android

      - name: إعداد مشروع Android (إصدار + توقيع + صلاحيات + مثبّت التحديث)
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: python3 tools/android/inject-android.py .

      - name: Icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - run: npx cap sync android

      - name: فك المفتاح
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/osret-release.jks"
          test -s "$RUNNER_TEMP/osret-release.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 ليس base64 صالحًا"; exit 1; }
          echo "OSRET_KS_PATH=$RUNNER_TEMP/osret-release.jks" >> "$GITHUB_ENV"

      - name: بناء Release
        working-directory: android
        env:
          OSRET_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OSRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OSRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: التحقق من التوقيع والإصدار
        id: apk
        env:
          EXPECTED_CERT: ${{ vars.EXPECTED_CERT_SHA256 }}
          WANT_CODE: ${{ steps.ver.outputs.code }}
          WANT_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -e
          DIR=android/app/build/outputs/apk/release
          SRC=$(ls $DIR/*.apk | head -1)
          [ -f "$SRC" ] || { echo "::error::لم يُنتج APK في $DIR"; exit 1; }
          case "$SRC" in *unsigned*) echo "::error::الـ APK غير موقّع"; exit 1;; esac
          OUT="Osret-Thanawy-Service-v${WANT_NAME}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/sig.txt
          CERT=$(grep -m1 certificate.SHA-256.digest /tmp/sig.txt | awk '{print $NF}')
          [ -n "$CERT" ] || { echo "::error::تعذّر قراءة بصمة الشهادة"; exit 1; }
          if grep -qi 'CN=Android Debug' /tmp/sig.txt; then echo "::error::الـ APK موقّع بمفتاح Debug"; exit 1; fi
          BADGE=$("$BT/aapt2" dump badging "$OUT" | head -1)
          echo "$BADGE"
          echo "$BADGE" | grep -q "name='$OSRET_PACKAGE'"      || { echo "::error::اسم الحزمة غير $OSRET_PACKAGE"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$WANT_CODE'" || { echo "::error::versionCode غير $WANT_CODE"; exit 1; }
          if [ -n "$EXPECTED_CERT" ]; then
            A=$(echo "$CERT" | tr -d ':' | tr 'A-F' 'a-f'); B=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$A" = "$B" ] || { echo "::error::بصمة الشهادة ($A) تختلف عن المتوقعة EXPECTED_CERT_SHA256 — هذا مفتاح غير الذي ثبّتّ به المستخدمون. أوقفت الإصدار."; exit 1; }
            echo "تطابق بصمة الشهادة مع المتوقعة ✓"
          else
            echo "::warning::لم تُضبط EXPECTED_CERT_SHA256. انسخ بصمة الشهادة التالية واحفظها كمتغيّر مستودع (Variables) لحماية كل الإصدارات القادمة: $CERT"
          fi
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "$SHA  $OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          {
            echo "### Osret Thanawy APK"
            echo "- الإصدار: \`$WANT_NAME\` (versionCode \`$WANT_CODE\`)"
            echo "- SHA-256 للملف: \`$SHA\`"
            echo "- بصمة شهادة التوقيع (يجب أن تبقى ثابتة دائمًا): \`$CERT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Osret-Thanawy-Service-APK
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.apk.outputs.file }}
          SHA: ${{ steps.apk.outputs.sha }}
          CERT: ${{ steps.apk.outputs.cert }}
          VN: ${{ steps.ver.outputs.name }}
          VC: ${{ steps.ver.outputs.code }}
        run: |
          TAG="v${VN}-build${GITHUB_RUN_NUMBER}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
          NOTES="الإصدار ${VN} (versionCode ${VC})
          رابط التحميل المباشر (للصقه في صفحة التحديثات داخل التطبيق):
          ${URL}
          SHA-256: ${SHA}
          بصمة الشهادة: ${CERT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber
          else
            gh release create "$TAG" "$FILE" "$FILE.sha256" --title "Osret Thanawy ${VN} (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES"
          fi
          echo "رابط التحميل: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $SHA" >> "$GITHUB_STEP_SUMMARY"
